name: fix-owner
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write owner.json without trailing newline
        run: printf '%s' '{"wallet":"2yGxHEw1CUFgJYYNFWrsiggrejYYgiW5SJ4brmDPZ2Yk"}' > .makefun/owner.json
      - name: Commit if changed
        run: |
          git config user.name mitsukikun
          git config user.email mitsukikun@users.noreply.github.com
          git add .makefun/owner.json
          git diff --cached --quiet || git commit -m "Set owner.json to 57 bytes, no trailing newline"
          git push
